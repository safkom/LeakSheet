services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Must stay 0 with >1 gunicorn worker: see docs/decisions.md::api.py — prewarm loop
      LEAKSHEET_PREWARM: "0"
    volumes:
      - cache:/app/.cache
    # ~2x headroom for three workers, while keeping a runaway parse from taking the
    # host, which also serves the LAN's DNS.
    mem_limit: 6g
    pids_limit: 512
    # Per-service rotation (the default json-file driver is unbounded), leaving the
    # host-wide /etc/docker/daemon.json untouched.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      # Wait for the HEALTHCHECK, not just for the container to exist —
      # otherwise nginx starts proxying before the API is listening.
      api:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cache:

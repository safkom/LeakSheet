services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - cache:/app/.cache

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      # Wait for the HEALTHCHECK, not just for the container to exist —
      # otherwise nginx starts proxying before the API is listening.
      api:
        condition: service_healthy

volumes:
  cache:

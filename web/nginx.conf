# Cache policy by final URI. A map keeps this out of the location blocks:
# an `add_header` inside a location silently drops every add_header inherited
# from the server level, which would strip the security headers below from
# exactly the responses that carry the most bytes.
# try_files rewrites $uri to /index.html before this is evaluated, so an SPA
# route lands on the no-cache branch rather than the default.
map $uri $ls_cache_control {
    default            "";
    "~^/assets/"       "public, max-age=31536000, immutable";  # Vite content-hashes these
    "~^/index\.html$"  "no-cache";                             # or a deploy never lands
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `always`, so these still apply to the 404s below and to error pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors only. A full CSP needs a pass over the Vue build's inline
    # styles first; shipping a broken one would be worse than shipping none.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $ls_cache_control always;

    # ^~ so the regex deny rules below cannot outrank this. FastAPI already
    # answers unknown /api/ paths with a real 404 (verified against the live
    # origin), so they need no help and must not be intercepted.
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Ordering that matters: gunicorn --timeout 90 < Cloudflare's edge read
        # timeout (125s, a zone setting and not raisable below Enterprise) <
        # this. Keeping nginx last means a wedged worker is recycled, and the
        # edge gives up, before nginx does — so nobody waits on a dead request.
        # It was 180s against a 120s gunicorn watchdog; both numbers moved.
        proxy_read_timeout 120s;
    }

    # Nothing here is ever a real file, and the SPA has no path-based routes —
    # it keeps no state in the URL at all, so `try_files` only ever resolves
    # `/`. Before these rules the fallback answered 200 + index.html to every
    # probe, which is what marks a host as worth revisiting: ~1,400 scanner
    # requests crossed the tunnel in the week to 2026-09-21, hunting `.env`,
    # `phpinfo.php`, `.git/config` and `.bashrc`. A 404 ends that.
    # The lookahead keeps /.well-known/ reachable. Nothing serves it today
    # (no universal links, no origin ACME — Cloudflare terminates TLS), but a
    # deny rule that silently breaks an app-site-association added later is a
    # bad trade for one line.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php|ya?ml|sql|bak|log|ini|sh|env)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

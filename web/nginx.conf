# One line per request with latency and the Cloudflare Ray ID, which the API's GlitchTip
# events and the iOS app's error logs carry too.
log_format leaksheet '$http_cf_connecting_ip "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time ray=$http_cf_ray '
                     'ua="$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log leaksheet;
    server_name _;

    # `always`, so these still apply to the 404s below and to error pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No HTML is served, so nothing needs to load or frame anything.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # FastAPI answers unknown /api/ paths with a real 404 itself.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Above gunicorn's --timeout 90, so a wedged worker is recycled before nginx
        # gives up. Cloudflare's edge read timeout is 125 s.
        proxy_read_timeout 120s;
    }

    # An API host has nothing worth crawling.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = / {
        default_type text/plain;
        return 200 "LeakSheet API\n";
    }

    # A catch-all 200 marks the host as worth scanning.
    location / {
        return 404;
    }
}

# Cache policy by final URI, as a map: an `add_header` inside a location drops every
# inherited server-level add_header, including the security headers below.
map $uri $ls_cache_control {
    default            "";
    "~^/assets/"       "public, max-age=31536000, immutable";  # Vite content-hashes these
    "~^/index\.html$"  "no-cache";                             # or a deploy never lands
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `always`, so these still apply to the 404s below and to error pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors only. A full CSP needs a pass over the Vue build's inline
    # styles first; shipping a broken one would be worse than shipping none.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $ls_cache_control always;

    # ^~ so the regex deny rules below cannot outrank this; FastAPI answers unknown
    # /api/ paths with a real 404 itself.
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Above gunicorn's --timeout 90, so a wedged worker is recycled before nginx
        # gives up. Cloudflare's edge read timeout is 125 s.
        proxy_read_timeout 120s;
    }

    # Defence in depth: never serve a dotfile. The lookahead keeps /.well-known/
    # reachable for a future app-site-association or ACME challenge.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # No SPA fallback: the app has no client-side routing, and a catch-all 200 marks
    # the host as worth scanning. Adding routing means `try_files $uri /index.html`.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily — catches "a tracker changed format and the parser now drops data"
    # even on days with no code changes.
    - cron: "0 6 * * *"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline suite (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Bare pytest = the offline gate (addopts excludes live/accuracy/slow).
      # Deterministic, no network, no Trackers/ dumps needed. This gates merges.
      - run: uv run pytest

  live:
    name: Live invariants (latest data)
    runs-on: ubuntu-latest
    # Tracker availability / Google rate-limiting must never block a merge —
    # this job is informational. Real parse breaks still show up as failures.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The locked public URL set only (excludes the slow full TrackerHub
      # sweep, which is a deliberate local/cron-scale run, not a PR gate).
      - run: uv run pytest -m "live and not slow" -ra

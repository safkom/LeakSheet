name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline suite (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      # Bare pytest = the offline gate (addopts excludes live/accuracy/slow; the network
      # is refused). Coverage is reported, not enforced.
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t leaksheet-api .
      - run: docker build -t leaksheet-web web
      # nginx resolves proxy_pass hosts at load time, hence the stand-in for `api`.
      - run: docker run --rm --add-host api:127.0.0.1 leaksheet-web nginx -t
      # Load test the production image (gunicorn, 3 workers) on a seeded cache: no
      # request leaves the runner. The container's uid writes the seed, so it can read it.
      - name: Seed a cache and start the API image
        run: |
          mkdir -m 777 k6cache
          docker run --rm -v "$PWD/tests:/app/tests:ro" -v "$PWD/k6cache:/app/.cache" \
            leaksheet-api python -m tests.load.seed_cache /app/.cache
          docker run -d --name api -p 8080:8080 -v "$PWD/k6cache:/app/.cache" leaksheet-api
          for i in $(seq 60); do curl -sf http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - uses: grafana/setup-k6-action@v1
      - run: k6 run tests/load/api.js
      - if: failure()
        run: docker logs api

  ios:
    name: iOS tests
    # GitHub-hosted arm64 image with Xcode 27; the app's deployment target is
    # iOS 27, so no older image can build it.
    runs-on: xcode-27
    # Don't let a hung simulator hold the runner for the 6 h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Device names shift between image releases — take an iPhone on the
      # newest iOS runtime the image ships rather than hardcoding one.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda r: [int(n) for n in r.rsplit(".iOS-", 1)[1].split("-")]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: xcodebuild test
        working-directory: LeakSheet-iOS
        run: |
          xcodebuild test \
            -project LeakSheet.xcodeproj \
            -scheme LeakSheet \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO
      # The macOS and tvOS targets share most code but compile their own views.
      - name: xcodebuild build (macOS, tvOS)
        working-directory: LeakSheet-iOS
        run: |
          xcodebuild build -project LeakSheet.xcodeproj -scheme LeakSheet \
            -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project LeakSheet.xcodeproj -scheme LeakSheetTV \
            -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO

# SonarQube analysis for the backend. The token is never stored here:
#   SONAR_TOKEN=... sonar-scanner
# after generating coverage with:
#   uv run coverage run -m pytest && uv run coverage xml
sonar.host.url=http://192.168.0.100:9000
sonar.projectKey=LeakSheet-api
sonar.projectName=LeakSheet-api

sonar.sources=src,Dockerfile
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# SonarQube analysis for the backend. Neither the server nor the token is stored here:
#   SONAR_HOST_URL=http://<server>:9000 SONAR_TOKEN=... sonar-scanner
# after generating coverage with:
#   uv run coverage run -m pytest && uv run coverage xml
sonar.projectKey=LeakSheet-api
sonar.projectName=LeakSheet-api

sonar.sources=src,Dockerfile
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# GitLab CI for the GitLab backup remote. GitHub Actions (.github/workflows) stays the
# main gate; this pipeline adds the scanners GitLab Free ships.
#
# CI/CD variables:
#   SONAR_HOST_URL, SONAR_TOKEN (masked): enable the sonarqube job.
#   The container registry must be enabled for build-image and container_scanning.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - test
  - build
  - scan

# Branch pipelines only: the stable security templates do not run in MR pipelines.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  timeout: 20m

variables:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.11.6-python3.14-trixie-slim
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_LINK_MODE: copy
  CS_IMAGE: $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA
  SAST_EXCLUDED_PATHS: "tests, .uv-cache, .venv"

.uv:
  image: $UV_IMAGE
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  after_script:
    - uv cache prune --ci

test:
  extends: .uv
  stage: test
  script:
    - uv sync --locked
    - uv run ruff check . --extend-exclude .uv-cache
    # Bare pytest is the offline gate: addopts excludes live/accuracy/slow.
    - uv run coverage run -m pytest --junitxml=report.xml
    - uv run coverage report
    - uv run coverage xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    paths: [coverage.xml]
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Dependency Scanning is Ultimate-only; pip-audit checks uv.lock against PyPI/OSV advisories.
dependency-audit:
  extends: .uv
  stage: test
  script:
    - uv export --locked --format requirements-txt --no-emit-project -o requirements.txt
    - uvx pip-audit==2.10.1 --require-hashes --disable-pip -r requirements.txt

build-image:
  stage: build
  image: docker:29.9.2
  services: [docker:29.9.2-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_REGISTRY && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CS_IMAGE" .
    - docker push "$CS_IMAGE"

container_scanning:
  stage: scan
  needs: [build-image]
  rules:
    - if: $CI_REGISTRY && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# SonarQube Community Build keeps one branch, so only the default branch is analysed.
sonarqube:
  stage: scan
  image: sonarsource/sonar-scanner-cli:12.3
  needs: [test]
  variables:
    GIT_DEPTH: "0"
    SONAR_USER_HOME: $CI_PROJECT_DIR/.sonar
  cache:
    key: sonar
    paths: [.sonar/cache]
  rules:
    - if: $SONAR_HOST_URL && $SONAR_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # sonar-project.properties pins a LAN host URL; the CI variable must win.
    - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true

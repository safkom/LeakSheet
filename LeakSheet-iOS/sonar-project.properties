# SonarQube analysis for the Apple apps. The token is never stored here:
#   SONAR_TOKEN=... sonar-scanner    (run from LeakSheet-iOS/)
# The server is Community Build, which has no Swift analyzer: this covers
# secrets detection plus the plists, privacy manifest, asset JSON and CI YAML.
sonar.host.url=http://192.168.0.100:9000
sonar.projectKey=LeakSheet-iOS
sonar.projectName=LeakSheet-iOS

sonar.sources=.
sonar.exclusions=build/**,**/*.xcassets/**/Contents.json,**/xcuserdata/**,DerivedData/**
sonar.sourceEncoding=UTF-8

# SonarQube analysis for the Apple apps, via the sonar-apple plugin
# (https://github.com/insideapp-fr/sonar-apple). The token is never stored here.
#
# Run from LeakSheet-iOS/ (SwiftLint and Periphery must be on PATH):
#   rm -rf build/result.xcresult
#   xcodebuild -project LeakSheet.xcodeproj -scheme LeakSheet \
#     -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
#     -derivedDataPath build/DerivedData-Sonar -resultBundlePath build/result.xcresult \
#     -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO clean test
#   SONAR_TOKEN=... sonar-scanner
sonar.host.url=http://192.168.0.100:9000
sonar.projectKey=LeakSheet-iOS
sonar.projectName=LeakSheet-iOS

sonar.sources=LeakSheet,LeakSheetTV,Shared
sonar.tests=LeakSheetTests
sonar.exclusions=**/*.xcassets/**/Contents.json,**/xcuserdata/**
sonar.sourceEncoding=UTF-8

sonar.apple.resultBundlePath=build/result.xcresult
sonar.apple.periphery.indexStorePath=build/DerivedData-Sonar/Index.noindex/DataStore

# Project and tool configuration for LeakSheet.
#
# Dependencies are locked in uv.lock, so checkout, CI and the production image
# install identical trees. Add or bump a dependency here, then `uv lock`.
# Also the single source of pytest config.

[project]
name = "leaksheet"
version = "0.1.0"
description = "Parses Google Sheets leak trackers into a structured API."
# api.py's range parsing relies on the 4300-digit str->int cap added in 3.11.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 0.23 is the first release whose asyncio_mode="auto" is stable under pytest 8/9.
    "pytest-asyncio>=0.23",
    "coverage[toml]>=7.0",
    "ruff>=0.14",
]

[tool.uv]
# The app runs from source (`from src.x`, via pythonpath below) and is never
# installed; a build backend would publish a top-level package named `src`.
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = [".cache", "Trackers", "web", "LeakSheet-iOS"]

[tool.ruff.lint]
# Correctness only: pyflakes plus the pycodestyle error classes that are bugs.
# Explicit, because ruff's defaults include style rules and CI gates on this.
select = ["E4", "E7", "E9", "F"]
# E741 ("l" as a name) is taste, not a bug.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Dev scripts put the repo root on sys.path before importing src.
"scripts/**" = ["E402"]
"tests/tools/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Import `src` as a top-level package without installing the project.
pythonpath = ["."]
# Coroutine tests need no per-test @pytest.mark.asyncio decorator.
asyncio_mode = "auto"
# Bare `pytest` is the fast offline gate: no network (live), no local-dump
# baselines (accuracy), no long sweeps (slow). An explicit `-m ...` overrides it.
addopts = "-ra --strict-markers -m 'not live and not accuracy and not slow'"
markers = [
  "live: hits real Google Sheets / provider hosts over the network. Excluded from the default run; used by the CI 'live' job (see .github/workflows/tests.yml).",
  "accuracy: data-quality checks needing real tracker HTML — structural invariants over the whole captured corpus, plus hand-labelled ground truth (tests/quality/). Skipped automatically when that content is absent (clean checkout / CI), since it is never committed.",
  "slow: long-running (e.g. the full 486-tracker mass validation).",
]
filterwarnings = [
  # pytest-asyncio<0.21 emits this until asyncio_mode is read; harmless.
  "ignore:The 'asyncio_mode' default value will change:DeprecationWarning",
  # pydantic v2 keeps v1 .dict()/.parse_obj() shims the code deliberately uses.
  "ignore:.*(dict\\(\\)|parse_obj|copy).*:DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

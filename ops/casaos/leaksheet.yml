# CasaOS app: the LeakSheet API and its nginx front (sheets.safko.eu via the tunnel).
# Images are built from the repo with `docker compose build` in ~/LeakSheet; this app
# runs them. The $-placeholders come from ~/LeakSheet/.env when the file is installed as
# /var/lib/casaos/apps/leaksheet/docker-compose.yml.
name: leaksheet
services:
  api:
    container_name: leaksheet-api
    hostname: leaksheet-api
    image: leaksheet-api:latest
    pull_policy: never
    restart: unless-stopped
    # Longer than gunicorn's 30 s graceful timeout, so a deploy does not SIGKILL streams.
    stop_grace_period: 35s
    environment:
      LEAKSHEET_TRUSTED_PROXY_HOPS: "${LEAKSHEET_TRUSTED_PROXY_HOPS}"
      LEAKSHEET_RATE_LIMIT_PER_MIN: "${LEAKSHEET_RATE_LIMIT_PER_MIN}"
      SENTRY_DSN: "${SENTRY_DSN}"
      LEAKSHEET_GOOGLE_API_KEY: "${LEAKSHEET_GOOGLE_API_KEY}"
    volumes:
      - type: bind
        source: /DATA/AppData/leaksheet/cache
        target: /app/.cache
        bind:
          create_host_path: true
    # The API fetches attacker-chosen URLs; only the cache, /tmp and gunicorn's socket are writable.
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.gunicorn:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # ~2x headroom for three workers, without letting a runaway parse take the host.
    deploy:
      resources:
        limits:
          memory: 6G
          pids: 512
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/music-assistant.png
      com.centurylinklabs.watchtower.enable: "false"   # built locally, never pulled
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks:
      leaksheet_network: null
    x-casaos:
      volumes:
        - container: /app/.cache
          description: { en_us: Parsed tracker and image cache }
  web:
    container_name: leaksheet-web
    hostname: leaksheet-web
    image: leaksheet-web:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      # The HEALTHCHECK, not just a started container: nginx must not proxy early.
      api:
        condition: service_healthy
        restart: true
    ports:
      - target: 80
        published: "8081"
        protocol: tcp
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/music-assistant.png
      com.centurylinklabs.watchtower.enable: "false"
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks:
      leaksheet_network: null
    x-casaos:
      ports:
        - container: "80"
          description: { en_us: nginx in front of the API (tunnel origin) }
networks:
  leaksheet_network:
    name: leaksheet_network
    driver: bridge
  default:
    name: leaksheet_default
x-casaos:
  architectures: [ amd64 ]
  main: web
  author: self
  developer: safkom
  category: Developer
  title: { en_us: LeakSheet }
  tagline: { en_us: Tracker parser API }
  description: { en_us: FastAPI tracker parser behind nginx, served at sheets.safko.eu. }
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/music-assistant.png
  index: /api/health
  port_map: "8081"
  scheme: http
